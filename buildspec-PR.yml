version: 0.2

phases:
  install:
    commands:
      - echo "Instalando node 21 e npm..."
      - curl -fsSL https://rpm.nodesource.com/setup_21.x | sudo bash -
      - sudo yum install -y nodejs
  build:
    commands: 
      - echo "Build iniciado em `date` validação de dependências..."
      - npm install --loglevel=error
      - cd client && VITE_API_URL=http://alb-bia-1097740364.us-east-1.elb.amazonaws.com npm run build && cd ..
      - echo "Rodando testes unitários..."`"
      - npm run test